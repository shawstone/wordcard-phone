<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>背单词卡片 · 四/六/考研</title>
<style>
  /* ===== 全局样式：改配色只需改这里 ===== */
  :root{
    --bg:#f4f6fa;          /* 页面背景色 */
    --card:#ffffff;        /* 卡片背景色 */
    --main:#2563eb;        /* 主色（按钮、进度条） */
    --ok:#16a34a;          /* “认识”绿色 */
    --no:#dc2626;          /* “不认识”红色 */
    --text:#1f2937;        /* 主要文字 */
    --sub:#6b7280;         /* 次要文字 */
    --line:#e5e7eb;        /* 分隔线 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;padding:14px;
    display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:12px;}

  /* ===== 顶部：标题 + 词表切换 ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .title{font-size:17px;font-weight:700;}
  .levels{display:flex;gap:6px;}
  .levels button{
    border:1px solid var(--line);background:#fff;color:var(--sub);
    padding:7px 13px;border-radius:999px;font-size:14px;cursor:pointer;
  }
  .levels button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:600;}

  /* ===== 进度区 ===== */
  .progress{
    background:#fff;border-radius:12px;padding:11px 14px;
    display:flex;justify-content:space-between;font-size:13px;color:var(--sub);
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .progress b{color:var(--text);font-size:15px;}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:-4px;}
  .bar i{display:block;height:100%;width:0;background:var(--main);transition:width .25s;}

  /* ===== 卡片：点击翻面 ===== */
  .cardbox{perspective:1200px;}
  .card{
    background:var(--card);border-radius:18px;min-height:270px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:26px 20px;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.07);
    transition:transform .18s;user-select:none;
  }
  .card:active{transform:scale(.99);}
  .word{font-size:40px;font-weight:700;letter-spacing:.5px;word-break:break-word;text-align:center;line-height:1.2;}
  .hint{font-size:13px;color:var(--sub);}
  .back{display:none;flex-direction:column;align-items:center;gap:14px;width:100%;}
  .card.flipped .front{display:none;}
  .card.flipped .back{display:flex;}
  .phonetic{font-size:17px;color:var(--main);}
  .meaning{font-size:21px;line-height:1.65;text-align:center;white-space:pre-wrap;}


  /* 富化信息区 */
  .enrich{width:100%;text-align:left;margin-top:6px;display:flex;flex-direction:column;gap:10px;}
  .esec{border-top:1px dashed var(--line);padding-top:8px;}
  .etitle{font-size:12px;color:var(--main);font-weight:600;margin-bottom:3px;}
  .etext{font-size:14px;line-height:1.6;color:var(--text);}
  .esub{font-size:12.5px;line-height:1.55;color:var(--sub);margin-top:3px;}



  /* ===== 按需查询的折叠区 ===== */
  .enrich{width:100%;text-align:left;margin-top:10px;}
  .ehint{font-size:11.5px;color:var(--sub);margin-bottom:6px;text-align:center;line-height:1.5;}
  .esec{border-top:1px solid var(--line);}
  .esec:last-child{border-bottom:1px solid var(--line);}
  .etitle{
    font-size:13.5px;font-weight:600;color:var(--main);
    padding:9px 2px;cursor:pointer;list-style:none;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .etitle::-webkit-details-marker{display:none;}
  .etitle::after{content:"＋";font-size:15px;color:var(--sub);font-weight:400;}
  details[open] > .etitle::after{content:"－";}
  .estate{font-size:11px;color:var(--sub);font-weight:400;margin-left:auto;margin-right:6px;}
  .etext{font-size:14px;line-height:1.7;color:var(--text);padding:0 2px 11px 2px;word-break:break-word;}
  .esub{font-size:12.5px;line-height:1.55;color:var(--sub);margin-top:4px;}
  .eload{color:var(--main);font-size:13px;}
  .eerr{color:var(--no);font-size:13px;}

  /* ===== 顶部 Key 设置条（手机版） ===== */
  .keybar{margin:12px 0 2px;}
  .kbhint{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.5;margin-bottom:6px;}
  .kbrow{display:flex;gap:6px;justify-content:center;align-items:center;}
  .kbrow input{
    flex:1;min-width:0;font-size:13px;padding:8px 10px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--text);-webkit-appearance:none;
  }
  .kbrow button{font-size:12.5px;padding:7px 10px;white-space:nowrap;}

  /* ===== 喇叭按钮 ===== */
  .speak{
    border:1px solid var(--line);background:#fff;border-radius:999px;
    width:38px;height:38px;font-size:17px;cursor:pointer;line-height:1;
  }
  .speak:active{background:#f0f2f7;}

  /* ===== 底部按钮：翻面前禁用，防止偷看答案 ===== */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .actions button{
    border:none;border-radius:14px;padding:17px 10px;font-size:17px;
    font-weight:600;color:#fff;cursor:pointer;
  }
  .actions button:disabled{opacity:.35;cursor:not-allowed;}
  #btnNo{background:var(--no);}
  #btnOk{background:var(--ok);}
  .flipbtn{
    border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;
    background:var(--main);color:#fff;cursor:pointer;width:100%;
  }

  /* ===== 备份区 ===== */
  .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .tools button{
    border:1px solid var(--line);background:#fff;color:var(--sub);
    border-radius:10px;padding:9px 13px;font-size:13px;cursor:pointer;
  }

  /* ===== 本轮结束提示 ===== */
  .done{display:none;background:#fff;border-radius:16px;padding:30px 20px;text-align:center;
        box-shadow:0 6px 20px rgba(0,0,0,.07);}  .done h2{margin:0 0 10px;font-size:21px;}
  .done p{color:var(--sub);margin:6px 0 20px;font-size:14px;}
  .done .flipbtn{max-width:220px;margin:0 auto;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:rgba(31,41,55,.94);color:#fff;padding:11px 18px;border-radius:10px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 顶部：标题 + 词表切换（四级 / 六级 / 考研） -->
  <div class="topbar">
    <div class="title">📖 背单词卡片</div>
    <div class="levels" id="levels">
      <button data-level="cet4" class="on">四级</button>
      <button data-level="cet6">六级</button>
      <button data-level="kaoyan">考研</button>
    </div>
  </div>

  <!-- 进度：本轮进度 + 已掌握数量 -->
  <div class="progress">
    <span>本轮 <b id="pDone">0</b> / <b id="pTotal">0</b></span>
    <span>已掌握 <b id="pKnown">0</b></span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="keybar" id="keyBar"></div>

  <!-- 卡片：正面英文，点击翻面看音标+释义 -->
  <div class="cardbox">
    <div class="card" id="card">
      <div class="front">
        <div class="word" id="word">—</div>
        <div class="hint">点击卡片查看释义</div>
      </div>
      <div class="back">
        <div class="phonetic" id="phonetic"></div>
        <button class="speak" id="speak" title="朗读">🔊</button>
        <div class="meaning" id="meaning"></div>
        <div class="enrich" id="enrich"></div>
      </div>
    </div>
  </div>

  <!-- 翻面按钮（未翻面时显示），翻面后换成 认识 / 不认识 -->
  <button class="flipbtn" id="flipBtn">显示释义</button>
  <div class="actions" id="actions" style="display:none">
    <button id="btnNo">不认识</button>
    <button id="btnOk">认识</button>
  </div>

  <!-- 备份工具 -->
  <div class="tools">
    <button id="expBtn">导出备份</button>
    <button id="impBtn">导入备份</button>
    <button id="resetBtn">清空本轮</button>
    <input type="file" id="impFile" accept=".json" style="display:none">
  </div>

  <!-- 本轮完成提示（隐藏） -->
  <div class="done" id="done">
    <h2>🎉 本轮完成！</h2>
    <p id="doneMsg"></p>
    <button class="flipbtn" id="againBtn">再来一轮</button>
  </div>

</div>
<div class="toast" id="toast"></div>

"paradox":{"ety":"词源：源自希腊语 paradoxos，para(相反)+doxa(意见)，经拉丁语进入英语。","parts":"para-(相反) + dox(意见) → 与常理相反的说法","tip":"para(反)+dox(观点)，反着说就是悖论。","ex":"It's a paradox that less is often more.","exCn":"少即是多，这真是个悖论。","fam":"paradoxical (adj. 矛盾的) / paradoxically (adv. 矛盾地) / paradoxist (n. 反论者)"},
"stable":{"ety":"源自拉丁语 stabilis（稳固的），来自 stare（站立），经古法语 estable 进入英语。","parts":"st-(站立) + -able(能…的) → 能站住的 → 稳定的","tip":"能站住(st)的(able)就是稳定的。","ex":"The patient's condition is now stable.","exCn":"病人的情况现在稳定了。","fam":"stability（名词：稳定性） / stabilize（动词：使稳定） / unstable（形容词：不稳定的）"},
"primary":{"ety":"源自拉丁语 primarius（第一的），由 primus（第一）派生而来，经古法语进入英语。","parts":"prim(第一) + -ary(形容词后缀) → 第一的 → 主要的","tip":"prim 是“第一”，primary 就是“首要的”。","ex":"Our primary goal is to improve students' reading skills.","exCn":"我们的首要目标是提高学生的阅读能力。","fam":"primarily（adv. 主要地） / prime（adj. 首要的） / primal（adj. 最初的）"},
"certificate":{"ety":"源自拉丁语 certificare，由 certus（确定的）与 facere（做）构成，意为使确定。","parts":"cert(确定) + fic(做) + ate(名词后缀) → 使确定之物 → 证书","tip":"cert(确定)+ificate，确定你能力的官方文件。","ex":"She received a certificate after completing the course.","exCn":"她完成课程后获得了一张证书。","fam":"certify (v. 证明) / certification (n. 认证) / certified (adj. 认证的)"},
"standpoint":{"ety":"源自古英语 standan（站立）+ 古英语 point（点），字面即“站立之点”，引申为立场。","parts":"stand(站立) + point(点) → 站立的位置 → 立场","tip":"stand（站）+ point（点）= 你站的那个点就是立场。","ex":"From my standpoint, the plan needs more work.","exCn":"从我的立场看，这个计划还需要完善。","fam":"stand（动词/名词：站立；立场） / standing（形容词：常设的；名词：地位） / standee（名词：站票乘客）"},
"dragon":{"ety":"词源：源自希腊语 drakōn（巨蛇），经拉丁语 draco、古法语 dragon 进入英语。","parts":"无明显词根词缀","tip":"dragon 像“拽根”，龙拽着根守护宝藏。","ex":"The dragon guards the ancient treasure.","exCn":"这条龙守护着古老的宝藏。","fam":"dragonfly（名词：蜻蜓） / dragonish（形容词：龙似的） / dragonet（名词：小龙）"},
"grab":{"ety":"词源：源自中古英语 grabben，与古英语 græppian（抓取）同源，属日耳曼语系。","parts":"无明显词根词缀","tip":"grab 就是“抓”，抓住机会别放手。","ex":"She grabbed my arm suddenly.","exCn":"她突然抓住了我的手臂。","fam":"grabber（名词，抓取者） / grabbing（形容词，抓取的） / grabbed（动词过去式，抓取）"},
"capable":{"ety":"源自拉丁语 capere（抓取），经古法语 capable 进入英语，意为能抓住的、有能力的。","parts":"cap(抓取) + -able(能…的) → 能抓住的 → 有能力的","tip":"cap 抓 + able 能 → 能抓住机会的，就是有能力的","ex":"She is capable of solving this problem.","exCn":"她有能力解决这个问题。","fam":"capability (n. 能力) / capacious (adj. 容量大的) / incapable (adj. 无能力的)"},
"crucial":{"ety":"源自拉丁语 crux（十字、关键点），crucial 原指十字路口般的抉择关头，引申为决定性的。","parts":"cruc(十字，关键) + -ial(形容词后缀) → 如十字路口般关键的","tip":"记住 crux（关键），crucial 就是“关键的”。","ex":"Timing is crucial to the success of this plan.","exCn":"时机对这项计划的成功至关重要。","fam":"crux（n. 关键，症结） / crucially（adv. 关键地） / crucify（v. 钉十字架，严惩）"},
"criticism":{"ety":"源自希腊语kritikos（能判断的），经拉丁语criticus、法语critique进入英语，指评判的行为。","parts":"crit(判断) + -ic(形容词后缀) + -ism(名词后缀) → 判断的行为 → 批评","tip":"crit(判断) + ism(行为) → 批评","ex":"He accepted the criticism with grace.","exCn":"他优雅地接受了批评。","fam":"critic（名词：批评家） / critical（形容词：批判的） / criticize（动词：批评）"},
"flaw":{"ety":"词源：源自古诺斯语 flaga（石板碎片），经中古英语 flawe 演变，指物体裂痕或缺陷。","parts":"无明显词根词缀","tip":"flaw 像“裂缝”，小裂缝就是缺陷。","ex":"Pride was his only flaw.","exCn":"骄傲是他唯一的缺点。","fam":"flawed (adj. 有缺陷的) / flawless (adj. 完美的) / flawlessly (adv. 完美地)"},
"accommodation":{"ety":"源自拉丁语 accommodare，由 ad-(向) + commodus(合适) 构成，意为使适合。","parts":"ac-(加强) + commod(合适) + -ation(名词后缀) → 使合适 → 住处/适应","tip":"ac-加强 + commod 合适 → 使合适的地方 → 住处","ex":"We booked accommodation near the beach.","exCn":"我们在海滩附近预订了住处。","fam":"accommodate（动词：容纳；适应） / accommodating（形容词：乐于助人的） / accommodatingly（副词：乐于助人地）"},
"depressed":{"ety":"源自拉丁语 deprimere，de-(向下)+primere(压)，经古法语 depresser 进入英语，意为被压下。","parts":"de-(向下) + press(压) + -ed(形容词后缀) → 被向下压的 → 抑郁的","tip":"de 向下 + press 压，被压下去就是抑郁。","ex":"She felt depressed after losing her job.","exCn":"失业后她感到很沮丧。","fam":"depress（动词：使沮丧；压低） / depression（名词：抑郁；萧条） / depressive（形容词：抑郁的）"},
"imply":{"ety":"源自拉丁语 implicare，意为“卷入、缠绕”，由 in-(进入) + plicare(折叠) 构成。","parts":"im-(进入) + ply(折叠) → 折进去 → 隐含","tip":"im(进入)+ply(折叠)：把意思折进去，即暗示。","ex":"His silence seemed to imply agreement.","exCn":"他的沉默似乎暗示着同意。","fam":"implication（名词：含义） / implicit（形容词：含蓄的） / implicate（动词：牵连）"},
"obstacle":{"ety":"词源：源自拉丁语 obstaculum，由 ob-(反对) + stare(站立) 构成，意为“站在对面阻挡”。","parts":"ob-(反对) + sta(站立) + -cle(名词后缀) → 站在对面阻挡 → 障碍","tip":"ob(反) + sta(站) + cle → 反着站 → 障碍","ex":"Fear is the biggest obstacle to success.","exCn":"恐惧是成功最大的障碍。","fam":"obstruct (v. 阻碍) / obstruction (n. 阻碍) / obstinate (adj. 固执的)"},
"December":{"ety":"源自拉丁语 decem（十），古罗马历法中原为第十月，后因历法调整成为十二月。","parts":"decem(十) + -ber(月份后缀) → 第十月 → 十二月","tip":"decem 是十，December 原为十月，现为十二月。","ex":"Christmas falls in December every year.","exCn":"圣诞节每年都在十二月。","fam":"decemvir（名词：古罗马十人团成员） / decemvirate（名词：十人团职位） / decempedal（形容词：十英尺长的）"},
"automatic":{"ety":"源自希腊语 automatos（自行的），经拉丁语 automatus 进入英语，意为自动的。","parts":"auto-(自己) + matos(思考/动作) → 自己动作的 → 自动的","tip":"auto(自己) + matic(动作) → 自己动 → 自动的","ex":"The door is automatic and opens by itself.","exCn":"这扇门是自动的，会自己打开。","fam":"automatically (adv. 自动地) / automation (n. 自动化) / automate (v. 使自动化)"},
"president":{"ety":"拉丁语 praesidere（坐在前面）→ 古法语 president，指主持会议或领导的人。","parts":"pre-(在前) + sid(坐) + -ent(人) → 坐在前面的人 → 总统/主席","tip":"pre前+sid坐：坐在最前面的人就是总统。","ex":"The president gave a speech at the ceremony.","exCn":"总统在典礼上发表了演讲。","fam":"preside（动词：主持） / presidency（名词：总统职位） / presidential（形容词：总统的）"},
"passionate":{"ety":"词源：源自拉丁语 passio（受苦、情感），经古法语 passion 进入英语，加 -ate 形容词后缀。","parts":"pass(受苦/情感) + -ion(名词后缀) + -ate(形容词后缀) → 充满情感的 → 热情的","tip":"passion（激情）+ ate → 充满激情的","ex":"She is passionate about teaching children.","exCn":"她对教孩子充满热情。","fam":"passion（名词：热情、激情） / passionately（副词：热情地） / passionless（形容词：冷漠的）"},
"lately":{"ety":"源自古英语 læt（迟的、慢的），加副词后缀 -ly，本义为“近来、最近”。","parts":"late(迟的、近来的) + -ly(副词后缀) → 近来","tip":"late 加 -ly，表示“最近”。","ex":"I haven't seen him lately.","exCn":"我最近没见过他。","fam":"late（adj. 迟的） / lateness（n. 迟） / later（adv. 后来）"},
"gambling":{"ety":"词源：源自古英语 gamen（游戏、娱乐），后加 -le 表反复动作，引申为赌博。","parts":"game(游戏) + -le(反复动作) + -ing(动名词后缀) → 反复游戏 → 赌博","tip":"game 加 -ble 变 gamble，赌博就是玩危险的游戏。","ex":"He lost all his money gambling last night.","exCn":"他昨晚赌博输光了所有的钱。","fam":"gamble（动词/名词：赌博） / gambler（名词：赌徒） / gaming（名词：赌博/游戏）"},
"down":{"ety":"词源：古英语 dūne，意为“从高处向下”，原为 dūne 的与格形式，后演变为副词和介词。","parts":"无明显词根词缀","tip":"down 本义“从高处向下”，联想“向下”方向即可。","ex":"She looked down at her shoes.","exCn":"她低头看着自己的鞋子。","fam":"downward（副词：向下） / downstairs（副词：在楼下） / downhill（副词：向山下）"},
"logic":{"ety":"源自希腊语 logos（理性、言词），经拉丁语 logica 和古法语 logique 进入英语。","parts":"log(言词/理性) + -ic(……的) → 与理性相关的 → 逻辑","tip":"log 是“理性言词”，加 -ic 就是逻辑。","ex":"Your logic is flawed.","exCn":"你的逻辑有缺陷。","fam":"logical（形容词：合乎逻辑的） / logician（名词：逻辑学家） / illogical（形容词：不合逻辑的）"},
"matter":{"ety":"源自拉丁语 materia（物质、材料），经古法语 matere 进入英语，本义为构成事物的实体。","parts":"无明显词根词缀，源自拉丁语 materia 整体借入。","tip":"matter 本义“物质”，引申为“事情、要紧”。","ex":"It doesn't matter what others think.","exCn":"别人怎么想并不重要。","fam":"material（n. 材料） / matter（v. 要紧） / materialize（v. 实现）"},
"theory":{"ety":"源自希腊语 theoria（观看、思辨），经拉丁语进入英语，本义是观察与思考所得的看法。","parts":"theor(观看、思辨) + -y(名词后缀) → 观察思考的结果 → 理论","tip":"theor 看+思，看出来的道理就是理论。","ex":"In theory, the plan should work.","exCn":"理论上，这个计划应该可行。","fam":"theoretical (adj. 理论的) / theoretically (adv. 理论上) / theorist (n. 理论家)"},
"lake":{"ety":"词源：源自拉丁语 lacus（湖泊、水池），经古法语 lac 进入中古英语，拼写演变为 lake。","parts":"无明显词根词缀，为日耳曼语系基础词汇。","tip":"联想：lake 与 lacus 同源，像“泪”水汇成湖。","ex":"We swam in the calm lake at dawn.","exCn":"黎明时我们在平静的湖里游泳。","fam":"lakeside（名词：湖边） / lakefront（名词：湖滨） / laker（名词：湖鱼或湖区居民）"},
"download":{"ety":"词源：由 down（向下）与 load（装载）复合而成，20世纪随计算机技术出现。","parts":"down(向下) + load(装载) → 向下装载 → 下载","tip":"down（下）+ load（装）= 下载","ex":"I will download the app tonight.","exCn":"我今晚会下载这个应用。","fam":"load（动词/名词：装载） / upload（动词：上传） / downloadable（形容词：可下载的）"},
"nor":{"ety":"词源：源自古英语 nāhwæther，由 nā（不）与 hwæther（两者之一）缩合而成。","parts":"无明显词根词缀，由否定词 ne 与 or 缩合而成。","tip":"nor 常与 neither 连用，表示“也不”。","ex":"She neither called nor wrote.","exCn":"她既没打电话也没写信。","fam":"neither（conj. 也不） / either（conj. 或者） / not（adv. 不）"},
"signal":{"ety":"源自拉丁语 signum（记号），经古法语 signal 进入英语，意为“信号、示意”。","parts":"sign(记号) + -al(名词/形容词后缀) → 信号","tip":"sign（记号）+ al → 传递信息的记号 → 信号","ex":"The red light is a signal to stop.","exCn":"红灯是停下的信号。","fam":"sign（n. 记号；v. 签名） / signify（v. 表示，意味着） / signature（n. 签名）"},
"bench":{"ety":"源自古英语 benc，意为长凳，与德语 Bank 同源，日耳曼语系共有词。","parts":"无明显词根词缀","tip":"bench 谐音“奔驰”，长凳上停着奔驰车。记忆：长凳。","ex":"We sat on a bench in the park.","exCn":"我们坐在公园的长凳上。","fam":"bench（名词，长凳） / benches（名词复数，长凳） / benchwarmer（名词，替补队员）"},
"authoritative":{"ety":"源自拉丁语 auctor（创始人、权威），经古法语 autorite 进入英语，加 -ative 构成形容词。","parts":"author(权威) + -it(y)(名词后缀) + -ative(形容词后缀) → 有权威的","tip":"author（作者）→ 有权威的，记住“作者即权威”。","ex":"She gave an authoritative account of the event.","exCn":"她对事件做了权威性的叙述。","fam":"author（n. 作者） / authority（n. 权威） / authorize（v. 授权）"},
"rug":{"ety":"词源：源自中古英语 rugge，可能来自斯堪的纳维亚语，如挪威语 rugga（粗毛毯），与古英语 rysc（灯心草）无关。","parts":"无明显词根词缀","tip":"联想：rug 像“拉个”毯子铺地上。","ex":"She put a soft rug beside the bed.","exCn":"她在床边放了一块柔软的小地毯。","fam":"rug (名词，小地毯) / rugged (形容词，粗糙的) / ruglike (形容词，像地毯的)"},
"smooth":{"ety":"源自古英语 smōth，意为‘光滑的、平坦的’，与古高地德语 smuodi 同源。","parts":"无明显词根词缀","tip":"联想‘丝滑’的谐音：smooth 读似‘丝滑的’。","ex":"The baby's skin is very smooth.","exCn":"婴儿的皮肤非常光滑。","fam":"smoothly（副词：光滑地） / smoothness（名词：光滑） / smoothie（名词：冰沙）"},
"mirror":{"ety":"源自拉丁语 mirari（惊奇地看），经古法语 mirour 进入英语，本义是令人惊叹地观看之物。","parts":"mir(惊奇地看) + -or(表物) → 令人惊奇观看之物 → 镜子","tip":"mir 表惊奇地看，镜子让人惊奇地看自己。","ex":"She looked at herself in the mirror.","exCn":"她照了照镜子。","fam":"mirrorlike（形容词：如镜的） / mirroring（名词：镜像/反映） / mirrored（形容词：有镜面的）"},
"institution":{"ety":"源自拉丁语 instituere（建立、设立），经古法语 institution 进入英语。","parts":"in-(进入) + stitu(建立) + -tion(名词后缀) → 建立起来的事物 → 机构","tip":"in-进入 + stitu建立 → 建立起来的机构","ex":"Education is a fundamental institution in society.","exCn":"教育是社会的一项基本制度。","fam":"institute（动词/名词：建立；机构） / institutional（形容词：机构的） / institutionalize（动词：使制度化）"},
"draw":{"ety":"词源：源自古英语 dragan，意为拉、拖、拽，与古北欧语 draga 同源，属日耳曼语族。","parts":"无明显词根词缀，为古英语强变化动词，过去式 drew，过去分词 drawn。","tip":"draw 本义“拉”，拉笔画画，拉抽屉，拉出缺点。","ex":"She drew a beautiful picture of the sea.","exCn":"她画了一幅美丽的海景图。","fam":"drawing（名词：图画；绘画） / drawer（名词：抽屉；制图者） / drawback（名词：缺点；不利条件）"},
"vehicle":{"ety":"源自拉丁语 vehiculum（运输工具），来自 vehere（运送），经古法语 véhicule 进入英语。","parts":"veh(运送) + -icle(名词后缀，表工具) → 运送工具","tip":"veh 谐音“喂”，喂饱车才能运送 → 车辆","ex":"She parked the vehicle near the entrance.","exCn":"她把车停在入口附近。","fam":"vehicular（形容词，车辆的） / vehiculate（动词，用车运送） / vehiculation（名词，车辆运输）"},
"net":{"ety":"源自古英语 net，日耳曼语系，原指捕鱼用的网，后引申为网状物、净重等。","parts":"无明显词根词缀","tip":"net 本义渔网，引申网络、净重。","ex":"The fisherman cast his net into the sea.","exCn":"渔夫把网撒进海里。","fam":"netting（名词：网，网状物） / network（名词：网络） / netizen（名词：网民）"},

/* 词库总表：改这里的 key 就能改词表名 */
var WORD_BANK = {
  cet4:   { name:"四级", list:CET4 },
  cet6:   { name:"六级", list:CET6 },
  kaoyan: { name:"考研", list:KAOYAN }
};

/* ============================================================
   二、程序逻辑（一般不需要改）
   ============================================================ */
var STORE_KEY = "wordcard_state_v1";   // localStorage 键名

/* ★★★ 每天背多少词：改这个数字 ★★★
   0      = 该词表全部词
   50/100 = 每轮随机抽取这么多词（推荐 50，一天一轮最舒服）
   改了以后刷新页面即生效。 */
var DAILY_LIMIT = 50;

var state = {
  level: "cet4",   // 当前词表
  queue: [],       // 本轮待背队列（存单词本身）
  mastered: {},    // 已掌握：{ "四级": ["abandon", ...] }  按词表分别记录
  answered: {},    // 本轮已答过的词（去重，用于进度条）
  doneCount: 0,    // 本轮已答题次数（不认识的词重复出现会累加）
  roundTotal: 0    // 本轮总词数
};

var $ = function(id){ return document.getElementById(id); };

/* ---------- 读写 localStorage ---------- */
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ toast("保存失败：浏览器可能禁用了本地存储"); }
}
function load(){
  try{
    var s = localStorage.getItem(STORE_KEY);
    if(!s) return;
    var o = JSON.parse(s);
    if(o && typeof o === "object"){
      state.level     = o.level     || "cet4";
      state.mastered  = o.mastered  || {};
      state.queue     = o.queue     || [];
      state.answered  = o.answered  || {};
      state.doneCount = o.doneCount || 0;
      state.roundTotal= o.roundTotal|| 0;
    }
  }catch(e){ /* 数据损坏就忽略，重新开始 */ }
}

/* ---------- 取词辅助 ---------- */
function findWord(level, w){
  var list = WORD_BANK[level].list;
  for(var i=0;i<list.length;i++){ if(list[i][0]===w) return list[i]; }
  return null;
}
function masteredSet(level){
  if(!state.mastered[level]) state.mastered[level] = [];
  return state.mastered[level];
}

/* ---------- 本轮已答词集合（按词表分开记） ---------- */
function answeredSet(level){
  if(!state.answered[level]) state.answered[level] = [];
  return state.answered[level];
}

/* ---------- 开始新一轮：按 DAILY_LIMIT 抽词入队 ---------- */
function startRound(level){
  var list = WORD_BANK[level].list;
  var words = list.map(function(item){ return item[0]; });

  if(DAILY_LIMIT > 0 && words.length > DAILY_LIMIT){
    // 随机洗牌后取前 N 个，每次开新一轮顺序都不同
    for(var i=words.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = words[i]; words[i] = words[j]; words[j] = t;
    }
    words = words.slice(0, DAILY_LIMIT);
  }
  state.queue      = words;
  state.roundTotal = words.length;
  state.doneCount  = 0;
  state.answered[level] = [];   // 新一轮，已答记录清零
  save();
}

/* ---------- 检查队列是否与当前词表匹配 ---------- */
/* 防止：换过词表、或队列已答完时，重开页面出现“假完成” */
function queueValid(){
  if(!state.queue || !state.queue.length) return false;
  var list = WORD_BANK[state.level].list;
  for(var i=0;i<state.queue.length;i++){
    var w = state.queue[i], hit = false;
    for(var k=0;k<list.length;k++){ if(list[k][0]===w){ hit = true; break; } }
    if(!hit) return false;   // 队列里有不属于当前词表的词
  }
  return true;
}

/* ---------- 渲染 ---------- */
function currentWord(){
  while(state.queue.length){
    var w = state.queue[0];
    var item = findWord(state.level, w);
    if(item) return item;
    state.queue.shift();   // 数据异常时跳过
  }
  return null;
}

function render(){
  // 词表按钮高亮
  var btns = document.querySelectorAll("#levels button");
  for(var i=0;i<btns.length;i++){
    btns[i].className = (btns[i].getAttribute("data-level")===state.level) ? "on" : "";
  }
  // 进度：用「本轮已答过的不同单词数」，不认识的词重复出现不会让进度超过总数
  var doneDistinct = answeredSet(state.level).length;
  $("pDone").textContent  = doneDistinct;
  $("pTotal").textContent = state.roundTotal;
  $("pKnown").textContent = masteredSet(state.level).length;
  var pct = state.roundTotal ? Math.round(doneDistinct/state.roundTotal*100) : 0;
  if(pct > 100) pct = 100;
  $("bar").style.width = pct + "%";

  var item = currentWord();
  if(!item){
    // 本轮结束
    $("card").parentNode.style.display = "none";
    $("flipBtn").style.display = "none";
    $("actions").style.display = "none";
    $("done").style.display = "block";
    $("doneMsg").textContent = WORD_BANK[state.level].name + "词表本轮 " + state.roundTotal +
                               " 个词已过一遍，已掌握 " + masteredSet(state.level).length + " 个。";
    return;
  }
  $("card").parentNode.style.display = "";
  $("done").style.display = "none";

  // 卡片回到正面
  $("card").classList.remove("flipped");
  $("word").textContent     = item[0];
  $("phonetic").textContent = item[1] || "";
  $("meaning").textContent  = item[2] || "";
  $("flipBtn").style.display = "";
  $("actions").style.display = "none";
  renderEnrich(item[0]);
}

/* ---------- 翻面 ---------- */
function flip(){
  var c = $("card");
  c.classList.toggle("flipped");
  var flipped = c.classList.contains("flipped");
  $("flipBtn").style.display = flipped ? "none" : "";
  $("actions").style.display = flipped ? "grid" : "none";
  var it = currentWord();
  if(it) renderEnrich(it[0]);
}




/* ============ 手机单文件版：点标题才联网查询（直连 DeepSeek） ============
   不点不联网、不花钱；查过的词存在本机，再点不重复花钱。
   API Key 只保存在这台设备的浏览器里，不会上传到任何服务器。
*/
var PAGE_VERSION = "phone1";
var AI_ENABLED = true;

var API_URL = "https://api.deepseek.com/chat/completions";
var MODEL = "deepseek-chat";

var LS_KEY = "wc_ds_key";
var LS_CACHE = "wc_enrich_cache";

var BUILTIN = (typeof ENRICH !== "undefined" && ENRICH) ? ENRICH : {};  // 页面内置词条：免费
var AI_CACHE = {};        // 本机查过的词
var AI_LOADING = {};      // 正在查询的词
var MEM = {};             // localStorage 不可用时的兜底（关掉页面就没了）

function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return (k in MEM) ? MEM[k] : null; } }
function lsSet(k,v){ try { localStorage.setItem(k, v); } catch(e){ MEM[k] = v; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){ delete MEM[k]; } }

var API_KEY = lsGet(LS_KEY) || "";

(function restoreCache(){
  var raw = lsGet(LS_CACHE);
  if(!raw) return;
  try { var d = JSON.parse(raw); if(d && typeof d === "object") AI_CACHE = d; } catch(e){}
})();

function persistCache(){ lsSet(LS_CACHE, JSON.stringify(AI_CACHE)); }
function dataFor(w){ return AI_CACHE[w] || BUILTIN[w] || null; }
function builtinCount(){ return Object.keys(BUILTIN).length; }
function localCount(){ return Object.keys(AI_CACHE).length; }

var SYSTEM_PROMPT = "你是一名英语词汇教学专家，为中文母语的学习者讲解英语单词。"
                  + "你的回答必须是一个 JSON 对象，不要包含任何解释文字、不要用 markdown 代码块。";

function userPrompt(word){
  return '请为英语单词 "' + word + '" 生成学习资料，严格按下面 JSON 格式回答：\n\n'
       + '{\n'
       + '  "ety": "词源：用中文说明这个词的来源（拉丁语/古法语/古英语等）与构词来历，不超过 60 字",\n'
       + '  "parts": "词根词缀拆解：如 \'ab-(离开) + andon(控制) → 交出控制权 → 放弃\'；若无明显词缀则写 \'无明显词根词缀\'",\n'
       + '  "fam": ["同族词1（词性+中文）", "同族词2（词性+中文）", "同族词3（词性+中文）"],\n'
       + '  "ex": "一个地道的英文例句，12 词以内，必须包含 ' + word + '",\n'
       + '  "exCn": "上面例句的中文翻译",\n'
       + '  "tip": "一句话记忆技巧，不超过 30 字"\n'
       + '}\n\n'
       + '要求：\n'
       + '1. 只输出 JSON，不要任何多余文字\n'
       + '2. fam 必须是真正与 ' + word + ' 同词根的派生词（如 nation → national/nationality/nationalism），不要放拼写相近但词源无关的词\n'
       + '3. 所有中文内容简洁，总长度控制在 200 字以内';
}

function escHtml(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------- 顶部：Key 设置 + 缓存信息（纯本地，不联网） ---------- */
function renderKeyBar(){
  var box = $("keyBar");
  if(!box) return;
  var h = "";
  if(!API_KEY){
    h += '<div class="kbhint">第一次使用：把 DeepSeek 的 API Key 粘贴到这里（只保存在这台设备，不会上传）</div>'
       + '<div class="kbrow">'
       +   '<input id="keyInput" type="password" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false">'
       +   '<button id="keySave">保存</button>'
       + '</div>';
  }else{
    h += '<div class="kbhint">API Key 已保存在本机 · 页面内置 ' + builtinCount() + ' 词 · 本机新查 ' + localCount() + ' 词</div>'
       + '<div class="kbrow">'
       +   '<button id="keyEdit">修改 Key</button>'
       +   '<button id="cacheExport">导出查询记录</button>'
       +   '<button id="cacheClear">清空新查</button>'
       + '</div>';
  }
  box.innerHTML = h;

  var el;
  el = $("keySave");
  if(el) el.addEventListener("click", function(ev){
    ev.stopPropagation();
    var v = ($("keyInput").value || "").trim();
    if(!v){ toast("请先粘贴 API Key"); return; }
    API_KEY = v; lsSet(LS_KEY, v); renderKeyBar(); toast("Key 已保存到本机");
  });
  el = $("keyEdit");
  if(el) el.addEventListener("click", function(ev){
    ev.stopPropagation();
    API_KEY = ""; lsDel(LS_KEY); renderKeyBar();
    setTimeout(function(){ var i = $("keyInput"); if(i) i.focus(); }, 50);
  });
  el = $("cacheExport");
  if(el) el.addEventListener("click", function(ev){ ev.stopPropagation(); exportCache(); });
  el = $("cacheClear");
  if(el) el.addEventListener("click", function(ev){
    ev.stopPropagation();
    if(!confirm("清空本机新查的 " + localCount() + " 个词？（页面内置的 " + builtinCount() + " 词不受影响）")) return;
    AI_CACHE = {}; persistCache(); renderKeyBar(); renderEnrich((currentWord() || [""])[0]);
    toast("已清空新查询");
  });
}

function exportCache(){
  if(!localCount()){ toast("还没有本机新查的词"); return; }
  var d = new Date();
  var stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  var blob = new Blob([JSON.stringify(AI_CACHE, null, 1)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "enrich_phone_" + stamp + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast("已导出 " + localCount() + " 个词");
}

/* ---------- 卡片背面：先画出 5 个可点的折叠标题（不联网） ---------- */
function renderEnrich(word){
  var box = $("enrich");
  if(!box) return;
  if(!AI_ENABLED){ box.innerHTML = ""; return; }

  var secs = [["parts","词根词缀"],["ety","词源"],["fam","同族词"],["ex","例句"],["tip","记忆技巧"]];
  var h = '<div class="ehint">点标题才会联网查询（查过的词会记住，再点不花钱）</div>';
  for(var i=0;i<secs.length;i++){
    h += '<details class="esec" data-field="' + secs[i][0] + '">'
       +   '<summary class="etitle">' + secs[i][1] + '<span class="estate">未查询</span></summary>'
       +   '<div class="etext"></div>'
       + '</details>';
  }
  box.innerHTML = h;

  /* 只在「冒泡阶段」拦一下，防止点折叠条时冒泡到卡片触发翻面。
     ⚠ 绝不能写成 addEventListener("click", fn, true)（捕获阶段），
     否则事件到不了 <summary>，点了不会有任何反应（电脑版踩过这个坑）。 */
  box.onclick = function(ev){ ev.stopPropagation(); };

  var sums = box.querySelectorAll("summary.etitle");
  for(var k=0;k<sums.length;k++){
    sums[k].addEventListener("click", function(ev){
      ev.stopPropagation();
      onClickSection(ev.currentTarget);
    });
  }
}

function onClickSection(summaryEl){
  setTimeout(function(){
    var el = summaryEl.parentNode;
    if(!el || !el.open) return;
    doQuery(el);
  }, 0);
}

function doQuery(el){
  var box = $("enrich");
  var body = el.querySelector(".etext");
  var state = el.querySelector(".estate");
  var item = currentWord();
  if(!box || !item) return;
  var word = item[0];

  var have = dataFor(word);
  if(have){
    fillSections(box, have);
    if(state) state.textContent = AI_CACHE[word] ? "本机缓存" : "内置";
    return;
  }
  if(AI_LOADING[word]){ body.innerHTML = '<span class="eload">正在查询…</span>'; return; }
  if(!API_KEY){
    body.innerHTML = '<span class="eerr">还没有设置 API Key，请在最上方输入后重试</span>';
    if(state) state.textContent = "待设置";
    return;
  }

  AI_LOADING[word] = true;
  body.innerHTML = '<span class="eload">正在向 DeepSeek 查询…（约 2~8 秒）</span>';
  if(state) state.textContent = "查询中";

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + API_KEY },
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: "system", content: SYSTEM_PROMPT },
        { role: "user", content: userPrompt(word) }
      ],
      temperature: 0.3,
      max_tokens: 500,
      response_format: { type: "json_object" },
      stream: false
    })
  }).then(function(r){
    return r.text().then(function(t){ return { status: r.status, text: t }; });
  }).then(function(res){
    AI_LOADING[word] = false;
    if(res.status !== 200){ failQuery(el, apiError(res.status, res.text)); return; }
    var payload = null;
    try { payload = JSON.parse(res.text); } catch(e){}
    var content = payload && payload.choices && payload.choices[0]
                && payload.choices[0].message && payload.choices[0].message.content;
    var data = normalizeItem(parseReply(content));
    if(!data){ failQuery(el, "AI 返回内容无法解析，请重试"); return; }
    AI_CACHE[word] = data;
    persistCache();
    fillSections(box, data);
    renderKeyBar();
  }).catch(function(err){
    AI_LOADING[word] = false;
    var m = (err && err.message) ? err.message : String(err);
    failQuery(el, "联网失败：" + m + "（检查手机网络后重试）");
  });
}

function apiError(status, text){
  var msg = "";
  try { var e = JSON.parse(text); msg = (e && e.error && e.error.message) || ""; } catch(err){}
  if(status === 401) return "API Key 无效，请重新设置";
  if(status === 402) return "DeepSeek 余额不足，请充值";
  if(status === 429) return "请求太频繁，等几秒再点";
  return msg ? ("接口出错：" + String(msg).slice(0, 90)) : ("接口返回 HTTP " + status);
}

function failQuery(el, msg){
  var body = el.querySelector(".etext");
  var state = el.querySelector(".estate");
  if(body) body.innerHTML = '<span class="eerr">' + escHtml(msg) + '</span>';
  if(state) state.textContent = "失败";
  if(msg.indexOf("API Key") !== -1){       // key 有问题就把输入框放回来
    API_KEY = ""; lsDel(LS_KEY); renderKeyBar();
  }
}

function parseReply(text){
  if(!text) return null;
  var t = String(text).trim().replace(/^```(?:json)?\s*/, "").replace(/\s*```$/, "");
  try { return JSON.parse(t); } catch(e){}
  var a = t.indexOf("{"), b = t.lastIndexOf("}");
  if(a !== -1 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  return null;
}

function normalizeItem(o){
  if(!o || typeof o !== "object") return null;
  function s(v, n){ return String(v == null ? "" : v).trim().slice(0, n); }
  var it = { ety: s(o.ety,200), parts: s(o.parts,200), ex: s(o.ex,200), exCn: s(o.exCn,200), tip: s(o.tip,120), fam: [] };
  if(Object.prototype.toString.call(o.fam) === "[object Array]"){
    for(var i=0;i<o.fam.length && it.fam.length<5;i++){ var x = s(o.fam[i], 60); if(x) it.fam.push(x); }
  }else if(typeof o.fam === "string" && o.fam.trim()){
    var parts = o.fam.split(/[,，\/、]/);
    for(var j=0;j<parts.length && it.fam.length<5;j++){ var y = s(parts[j], 60); if(y) it.fam.push(y); }
  }
  if(!it.ety && !it.parts && !it.ex && !it.fam.length) return null;
  return it;
}

function fillSections(box, data){
  var map = {
    "parts": data.parts || "（无）",
    "ety":   data.ety   || "（无）",
    "fam":   data.fam   ? (Object.prototype.toString.call(data.fam) === "[object Array]" ? data.fam.join(" / ") : data.fam) : "（无）",
    "ex":    data.ex    || "（无）",
    "tip":   data.tip   || "（无）"
  };
  var list = box.querySelectorAll("details.esec");
  for(var i=0;i<list.length;i++){
    var el = list[i];
    var f = el.getAttribute("data-field");
    var body = el.querySelector(".etext");
    var state = el.querySelector(".estate");
    if(f === "ex" && data.exCn){
      body.innerHTML = escHtml(data.ex) + '<div class="esub">' + escHtml(data.exCn) + '</div>';
    }else{
      body.innerHTML = escHtml(map[f] || "（无）");
    }
    if(state && (state.textContent === "未查询" || state.textContent === "查询中")) state.textContent = "已查询";
  }
}

/* 页面加载时先画一次顶部 Key 设置条（此时 DOM 已存在，state 也已初始化） */
try { renderKeyBar(); } catch(e) {}

/* ---------- 认识 / 不认识 ---------- */
function mark(known){
  var item = currentWord();
  if(!item) return;
  var w = item[0];
  state.queue.shift();                       // 从队首移除
  var aset = answeredSet(state.level);
  if(aset.indexOf(w) === -1) aset.push(w);   // 记为本轮已答
  if(known){
    var set = masteredSet(state.level);
    if(set.indexOf(w) === -1) set.push(w);   // 记入已掌握
  }else{
    state.queue.push(w);                     // 放回队尾，之后再来
  }
  state.doneCount++;                          // 本轮完成数 +1
  save();
  render();
}

/* ---------- 朗读 ---------- */
function speak(){
  var item = currentWord();
  if(!item) return;
  if(!("speechSynthesis" in window)){ toast("这个浏览器不支持朗读"); return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(item[0]);
    u.lang = "en-US";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){ toast("朗读失败：" + e.message); }
}

/* ---------- 提示条 ---------- */
var toastTimer = null;
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2000);
}

/* ---------- 导出 / 导入备份 ---------- */
function exportBackup(){
  var data = JSON.stringify(state, null, 2);
  var blob = new Blob([data], {type:"application/json"});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  var d    = new Date();
  var stamp = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  a.href = url;
  a.download = "背单词备份-" + stamp + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("已导出备份文件");
}

function importBackup(file){
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var o = JSON.parse(fr.result);
      if(!o || typeof o !== "object" || !o.mastered) throw new Error("文件内容不像备份");
      state.level      = o.level      || "cet4";
      state.mastered   = o.mastered   || {};
      state.queue      = o.queue      || [];
      state.answered   = o.answered   || {};
      state.doneCount  = o.doneCount  || 0;
      state.roundTotal = o.roundTotal || 0;
      if(!WORD_BANK[state.level]) state.level = "cet4";
      save(); render();
      toast("导入成功");
    }catch(e){ toast("导入失败：" + e.message); }
  };
  fr.onerror = function(){ toast("读取文件失败"); };
  fr.readAsText(file, "utf-8");
}

/* ---------- 事件绑定 ---------- */
/* 点在富化区内（词源/词根词缀等）时不翻面 */
function clickInsideEnrich(ev){
  var box = $("enrich");
  var n = ev.target;
  while(n){ if(n === box) return true; n = n.parentNode; }
  return false;
}
$("card").addEventListener("click", function(ev){
  if(clickInsideEnrich(ev)) return;
  flip();
});
$("flipBtn").addEventListener("click", flip);
$("speak").addEventListener("click", function(e){
  e.stopPropagation();          // 关键：阻止冒泡，否则点喇叭会连带把卡片翻回正面
  speak();
});
$("btnOk").addEventListener("click", function(){ mark(true); });
$("btnNo").addEventListener("click", function(){ mark(false); });

$("levels").addEventListener("click", function(e){
  var btn = e.target.closest("button");
  if(!btn) return;
  var lv = btn.getAttribute("data-level");
  if(!lv || lv === state.level) return;
  state.level = lv;
  startRound(lv);      // 切词表就开新一轮（各自进度已单独保存）
  save(); render();
});

$("expBtn").addEventListener("click", exportBackup);
$("impBtn").addEventListener("click", function(){ $("impFile").click(); });
$("impFile").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  e.target.value = "";   // 允许重复导入同一个文件
});
$("resetBtn").addEventListener("click", function(){
  if(!confirm("确定清空「" + WORD_BANK[state.level].name + "」本轮的进度吗？（已掌握记录也会清空）")) return;
  state.mastered[state.level] = [];
  state.answered[state.level] = [];
  startRound(state.level);
  render();
  toast("已清空本轮");
});
$("againBtn").addEventListener("click", function(){
  startRound(state.level);
  render();
  toast("开始新一轮");
});

/* ---------- 启动 ---------- */
(function init(){
  load();
  if(!WORD_BANK[state.level]) state.level = "cet4";
  // 队列为空或与当前词表不匹配（首次打开 / 上轮已结束 / 换过词表）就开新一轮
  if(!queueValid()) startRound(state.level);
  render();
})();
</script>
</body>
</html>
